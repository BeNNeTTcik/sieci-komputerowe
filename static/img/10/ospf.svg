<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="340" fill="#ffffff"/>

  <!-- panel dividers -->
  <line x1="320" y1="20" x2="320" y2="300" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="640" y1="20" x2="640" y2="300" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- step badges -->
  <circle cx="40" cy="35" r="16" fill="#2563eb"/>
  <text x="40" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <circle cx="360" cy="35" r="16" fill="#2563eb"/>
  <text x="360" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <circle cx="680" cy="35" r="16" fill="#2563eb"/>
  <text x="680" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>

  <!-- ============ PANEL 1: SASIEDZTWO (HELLO) ============ -->
  <g>
    <circle cx="90" cy="150" r="30" fill="#2563eb"/>
    <text x="90" y="156" text-anchor="middle" font-size="20" fill="#ffffff">🌐</text>
    <circle cx="230" cy="150" r="30" fill="#2563eb"/>
    <text x="230" y="156" text-anchor="middle" font-size="20" fill="#ffffff">🌐</text>

    <path d="M124,140 Q160,120 196,140" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M196,160 Q160,180 124,160" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="160" y="112" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="600">HELLO</text>

    <text x="90" y="200" text-anchor="middle" font-size="13" fill="#374151">Router A</text>
    <text x="230" y="200" text-anchor="middle" font-size="13" fill="#374151">Router B</text>
  </g>
  <text x="160" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Sąsiedztwo</text>
  <text x="160" y="278" text-anchor="middle" font-size="12.5" fill="#6b7280">"Widzimy się nawzajem"</text>

  <!-- ============ PANEL 2: WSPOLNA MAPA (LSDB) ============ -->
  <g>
    <rect x="370" y="90" width="220" height="130" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="410" cy="120" r="20" fill="#2563eb"/>
    <circle cx="550" cy="120" r="20" fill="#2563eb"/>
    <circle cx="410" cy="195" r="20" fill="#2563eb"/>
    <circle cx="550" cy="195" r="20" fill="#2563eb"/>
    <line x1="410" y1="120" x2="550" y2="120" stroke="#2563eb" stroke-width="2"/>
    <line x1="410" y1="120" x2="410" y2="195" stroke="#2563eb" stroke-width="2"/>
    <line x1="550" y1="120" x2="550" y2="195" stroke="#2563eb" stroke-width="2"/>
    <line x1="410" y1="195" x2="550" y2="195" stroke="#2563eb" stroke-width="2"/>
    <line x1="410" y1="120" x2="550" y2="195" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <text x="480" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Wspólna mapa sieci</text>
  <text x="480" y="278" text-anchor="middle" font-size="12.5" fill="#6b7280">LSA rozesłane do wszystkich → identyczna LSDB</text>

  <!-- ============ PANEL 3: SPF - KAZDY LICZY SAM ============ -->
  <g>
    <circle cx="680" cy="100" r="22" fill="#111827"/>
    <text x="680" y="106" text-anchor="middle" font-size="16" fill="#ffffff">🌐</text>

    <path d="M680,122 L760,190" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M680,122 L800,150" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrowGray)"/>

    <circle cx="760" cy="195" r="18" fill="#16a34a"/>
    <text x="760" y="200" text-anchor="middle" font-size="13" fill="#ffffff">🖥️</text>
    <circle cx="800" cy="155" r="16" fill="#cbd5e1"/>
    <text x="800" y="159" text-anchor="middle" font-size="11" fill="#475569">🖥️</text>

    <text x="700" y="165" font-size="11" fill="#16a34a" font-weight="700">koszt 3 ✓</text>
    <text x="812" y="140" font-size="11" fill="#94a3b8">koszt 9</text>
  </g>
  <text x="780" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Każdy liczy sam (SPF)</text>
  <text x="780" y="278" text-anchor="middle" font-size="12.5" fill="#6b7280">Ta sama mapa → wybór najtańszej drogi</text>

  <!-- flow arrows between panels -->
  <path d="M300,150 L320,150" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M620,150 L640,150" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowGray)"/>
</svg>
